#
# Config for GitHub's native "automatically generated release notes" feature
# (https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes).
# Only `changelog.exclude` and `changelog.categories` are part of that feature's schema and
# take effect. The automated release pipeline (release-automation.yaml) sets
# generateReleaseNotes: false and uses cliff.toml's output instead, so this file only matters
# if someone manually clicks "Generate release notes" in the GitHub UI, or runs
# `gh release create --generate-notes` / `gh release edit --generate-notes` by hand.
changelog:
  exclude:
    labels: ["wontfix", "question", "duplicate", "invalid"]
  categories:
    - title: "⭐ New Features"
      labels: ["New Feature"]
    - title: "🚀 Enhancements"
      labels: ["Feature Enhancement"]
    - title: "🐛 Bug Fixes"
      labels: ["Bug"]
    - title: "🔨 Tests"
      labels: ["Tests"]
    - title: "📝 Documentation"
      labels: ["Documentation", "Design"]
    - title: "🔒 Security"
      labels: ["Security"]
    - title: "🔧 Improvements"
      labels: ["Improvement"]
    - title: "🔥 Breaking Changes"
      labels: ["Breaking Change"]
    - title: "⬆️ Dependency Upgrades"
      labels: ["dependencies"]
