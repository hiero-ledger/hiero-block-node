# SPDX-License-Identifier: Apache-2.0
name: Release Automation

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: |
          Release type.
          rc     → next rc derived from existing vX.Y.Z-rcN tags of that version only.
                   From main: only rc1 (creates release/X.Y). From release/X.Y: the next rc.
          alpha  → main only. Counter derived from existing vX.Y.Z-alphaN tags, not
                   version.txt. No release branch, no version.txt commit anywhere - only
                   the tag is pushed.
          GA     → release/X.Y only. Strips the pre-release suffix and builds from the
                   highest existing vX.Y.Z-rcN tag (0.38.0-rc2 → 0.38.0).
          custom → uses the custom_version field below verbatim. Tags off the branch you
                   dispatch from - no release branch, no version.txt commit anywhere - only
                   the tag is pushed. A plain X.Y.Z (final release) or an rc-shaped version
                   must be dispatched from release/X.Y.
        required: true
        type: choice
        options:
          - rc
          - alpha
          - GA
          - custom
      custom_version:
        description: "Full version string — only honoured when release_type is 'custom' (e.g. 0.38.0-hotfix.1)"
        required: false
      allow_custom_without_release_branch:
        description: "Only honoured for 'custom'. Waives the requirement to dispatch from release/X.Y for a plain X.Y.Z or an rc-shaped version."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run (default). Computes the version and reports what would happen in the job summary, but creates no branch, commit, tag, release or PR. Untick to release for real."
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  release:
    timeout-minutes: 15
    name: Release
    runs-on: hl-bn-lin-md
    outputs:
      create_pr: ${{ env.CREATE_PR }}
      is_prerelease: ${{ env.IS_PRERELEASE }}
      next_version_snapshot: ${{ env.NEXT_VERSION_SNAPSHOT }}
      pr_title: ${{ env.PR_TITLE }}
      release_branch: ${{ env.RELEASE_BRANCH }}
      release_tag: ${{ env.RELEASE_TAG }}
      release_version: ${{ steps.version_parser.outputs.release }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
          persist-credentials: "true"

      - name: Compute Release Version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          INPUT_CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
          INPUT_ALLOW_CUSTOM: ${{ github.event.inputs.allow_custom_without_release_branch }}
        run: |
          git tag -l > "$RUNNER_TEMP/tags.txt"
          git tag --merged HEAD > "$RUNNER_TEMP/branch-tags.txt"
          git ls-remote --heads origin | sed 's#.*refs/heads/##' > "$RUNNER_TEMP/branches.txt"
          OUTPUT=$(tools-and-tests/scripts/release/compute-release-version.sh \
            --release-type "$INPUT_RELEASE_TYPE" \
            --ref-name "$REF_NAME" \
            --current-version "$(tr -d '[:space:]' < version.txt)" \
            --custom-version "$INPUT_CUSTOM_VERSION" \
            --allow-custom-without-release-branch "$INPUT_ALLOW_CUSTOM" \
            --tags-file "$RUNNER_TEMP/tags.txt" \
            --branches-file "$RUNNER_TEMP/branches.txt" \
            --branch-tags-file "$RUNNER_TEMP/branch-tags.txt")
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_ENV"

      - name: Parse Version
        id: version_parser
        uses: step-security/semver-utils@5bb182a08240146b23b61cc002cb74004377da4b # v5.0.0
        with:
          lenient: false
          version: ${{ env.COMPUTED_VERSION }}

      - name: Set Release Environment Variables
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          PREMINOR_VERSION=${{ steps.version_parser.outputs.inc-preminor }}
          NEXT_VERSION_SNAPSHOT=${PREMINOR_VERSION//-0/-SNAPSHOT}

          # alpha always tags off main; custom tags off whatever branch it was
          # dispatched from — neither creates or uses a release/X.Y branch.
          case "$INPUT_RELEASE_TYPE" in
            alpha)  RELEASE_BRANCH="main" ;;
            custom) RELEASE_BRANCH="$REF_NAME" ;;
            *)      RELEASE_BRANCH="release/${{ steps.version_parser.outputs.major }}.${{ steps.version_parser.outputs.minor }}" ;;
          esac

          [[ -z "${{ steps.version_parser.outputs.prerelease }}" ]] && \
            VERSION=${{ steps.version_parser.outputs.release }} || \
            VERSION="${{ steps.version_parser.outputs.release }}-${{ steps.version_parser.outputs.prerelease }}"
          RELEASE_TAG="v${VERSION}"

          cat >> $GITHUB_ENV <<EOF
          NEXT_VERSION_SNAPSHOT=$NEXT_VERSION_SNAPSHOT
          RELEASE_BRANCH=$RELEASE_BRANCH
          RELEASE_TAG=$RELEASE_TAG
          VERSION=$VERSION
          IS_PRERELEASE=$([[ -n "${{ steps.version_parser.outputs.prerelease }}" ]] && echo "true" || echo "false")
          EOF

      - name: Dry Run Summary
        if: ${{ inputs.dry_run }}
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          case "$INPUT_RELEASE_TYPE" in
            alpha|custom) ACTIONS="Commit the version bump locally and push only the tag $RELEASE_TAG from $RELEASE_BRANCH. No branch is pushed." ;;
            GA)           ACTIONS="Build GA from ${SOURCE_TAG:-the tip of $RELEASE_BRANCH}, push tag $RELEASE_TAG, then merge it into $RELEASE_BRANCH and push." ;;
            *)
              if git ls-remote --exit-code --heads --quiet origin "refs/heads/${RELEASE_BRANCH}" > /dev/null; then
                ACTIONS="Commit the version bump to the existing $RELEASE_BRANCH and push it with tag $RELEASE_TAG."
              else
                ACTIONS="Create and push $RELEASE_BRANCH, push tag $RELEASE_TAG, and open a PR bumping main to $NEXT_VERSION_SNAPSHOT."
              fi ;;
          esac
          {
            echo "## Release dry run (nothing was created)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Dispatched from | \`$REF_NAME\` |"
            echo "| Release type | \`$INPUT_RELEASE_TYPE\` |"
            echo "| Computed tag | \`$RELEASE_TAG\` |"
            echo "| Pre-release | \`$IS_PRERELEASE\` |"
            echo "| GA source tag | \`${SOURCE_TAG:-n/a}\` |"
            echo ""
            echo "**Would do:** $ACTIONS"
            echo ""
            echo "Re-run with \`dry_run\` unticked to release for real."
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Import GPG Key
        id: gpg_importer
        if: ${{ !inputs.dry_run }}
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_signingkey: true
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}

      - name: Install JDK
        if: ${{ !inputs.dry_run }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25.0.2"

      - name: Setup Gradle
        if: ${{ !inputs.dry_run }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Create and Switch to Release Branch
        # alpha and custom never use a release/X.Y branch - they tag directly off
        # whatever's already checked out (main for alpha, the dispatching branch for custom).
        if: ${{ !inputs.dry_run && github.event.inputs.release_type != 'alpha' && github.event.inputs.release_type != 'custom' }}
        env:
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          git fetch origin
          if ! git ls-remote --exit-code --heads --quiet origin refs/heads/${RELEASE_BRANCH}; then
            git checkout -b ${RELEASE_BRANCH}
            git push -u origin ${RELEASE_BRANCH}

            # create a PR to bump main branch to the next snapshot version
            echo "CREATE_PR=true" >> $GITHUB_ENV
            echo "PR_TITLE=chore(release): Bump versions for v$NEXT_VERSION_SNAPSHOT" >> $GITHUB_ENV
          elif [[ "$INPUT_RELEASE_TYPE" == "GA" && -n "$SOURCE_TAG" ]]; then
            # Build GA from the exact commit tagged as the last rc/alpha,
            # ignoring any drift on the release branch since then.
            git fetch origin "refs/tags/${SOURCE_TAG}:refs/tags/${SOURCE_TAG}"
            git checkout --detach "refs/tags/${SOURCE_TAG}"
          else
            git checkout ${RELEASE_BRANCH}
          fi

      - name: Bump Version
        if: ${{ !inputs.dry_run }}
        run: ./gradlew versionAsSpecified -PnewVersion=${{ env.VERSION }}

      - name: Commit and Tag
        if: ${{ !inputs.dry_run && github.event.inputs.release_type != 'GA' }}
        uses: step-security/git-auto-commit-action@ca31fda53dd20a6864523b29798308a4c5fa5cfa # v7.2.0
        with:
          commit_author: ${{ steps.gpg_importer.outputs.name }} <${{ steps.gpg_importer.outputs.email }}>
          commit_message: Bump versions for ${{ env.RELEASE_TAG }}
          commit_options: "--no-verify --signoff"
          commit_user_name: ${{ steps.gpg_importer.outputs.name }}
          commit_user_email: ${{ steps.gpg_importer.outputs.email }}
          tagging_message: ${{ env.RELEASE_TAG }}
          # alpha/custom: commit + tag locally only. Neither ever mutates main or the
          # dispatching branch — only the tag itself gets pushed, in the next step.
          skip_push: ${{ github.event.inputs.release_type == 'alpha' || github.event.inputs.release_type == 'custom' }}

      - name: Push Tag Only
        if: ${{ !inputs.dry_run && (github.event.inputs.release_type == 'alpha' || github.event.inputs.release_type == 'custom') }}
        run: git push origin ${{ env.RELEASE_TAG }}

      - name: Commit and Tag (GA)
        if: ${{ !inputs.dry_run && github.event.inputs.release_type == 'GA' }}
        env:
          GIT_AUTHOR_NAME: ${{ steps.gpg_importer.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg_importer.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg_importer.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg_importer.outputs.email }}
        run: |
          # GA is built on a detached HEAD (see "Create and Switch to Release
          # Branch") so, unlike the rc/alpha path above, only the tag is
          # pushed here. The release branch itself is synced separately (see
          # "Sync Release Branch with GA Tag") via a merge rather than here.
          git add -A
          git commit --no-verify --signoff -m "Bump versions for ${RELEASE_TAG}"
          git tag -s "${RELEASE_TAG}" -m "${RELEASE_TAG}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Sync Release Branch with GA Tag
        if: ${{ !inputs.dry_run && github.event.inputs.release_type == 'GA' }}
        env:
          GIT_AUTHOR_NAME: ${{ steps.gpg_importer.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.gpg_importer.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.gpg_importer.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.gpg_importer.outputs.email }}
        run: |
          # Bring the release branch's version.txt up to date with the GA tag
          # via a merge — never a force-push — so any commit that drifted onto
          # the branch after the last rc is preserved rather than discarded.
          # This fast-forwards when there's no drift, or creates a merge
          # commit when there is. A genuine conflict (a drifted commit also
          # touching the bumped files) fails the step so a human can resolve
          # it rather than having the workflow guess.
          git fetch origin "${RELEASE_BRANCH}"
          git checkout -B "${RELEASE_BRANCH}" "origin/${RELEASE_BRANCH}"
          git merge --no-edit "${RELEASE_TAG}"
          git push origin "${RELEASE_BRANCH}"

      - name: Generate Protobuf Artifact
        if: ${{ !inputs.dry_run }}
        run: ./gradlew :protobuf-sources:generateBlockNodeProtoArtifact

      - name: Upload Protobuf Artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-node-protobuf-${{ env.RELEASE_TAG }}
          path: ./protobuf-sources/block-node-protobuf-*.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Generate Block-Stream-Tools Artifact
        if: ${{ !inputs.dry_run }}
        run: |
          ./gradlew :tools:shadowJar
          cp ./tools-and-tests/tools/build/libs/tools-${{ env.VERSION }}-all.jar \
             ./tools-and-tests/tools/build/libs/block-stream-tools-${{ env.VERSION }}.jar

      - name: Upload Block-Stream-Tools Artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: block-stream-tools-${{ env.RELEASE_TAG }}
          path: ./tools-and-tests/tools/build/libs/block-stream-tools-${{ env.VERSION }}.jar
          if-no-files-found: error
          retention-days: 7

  generate_notes:
    name: Generate Release Notes
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/release-notes-generator.yaml
    with:
      release_branch: ${{ needs.release.outputs.release_branch }}
      release_tag: ${{ needs.release.outputs.release_tag }}
      is_prerelease: ${{ needs.release.outputs.is_prerelease }}
    secrets: inherit

  milestone_rollover:
    name: Roll Over Milestone
    needs: release
    if: ${{ !inputs.dry_run && needs.release.outputs.is_prerelease == 'false' }}
    uses: ./.github/workflows/milestone-rollover.yaml
    with:
      release_version: ${{ needs.release.outputs.release_version }}
      dry_run: "false"
    secrets: inherit

  create_release:
    timeout-minutes: 10
    name: Create GitHub Release
    runs-on: hl-bn-lin-md
    needs: [release, generate_notes]
    continue-on-error: true
    if: ${{ always() && !inputs.dry_run && needs.release.result == 'success' }}
    env:
      RELEASE_BRANCH: ${{ needs.release.outputs.release_branch }}
      RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
      RELEASE_NOTES_FILENAME: release_notes

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Download Release Notes Artifact
        id: download_notes
        continue-on-error: true
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "release-notes-${RELEASE_TAG}" \
            --dir .
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Ensure Release Notes File Exists
        run: touch "${RELEASE_NOTES_FILENAME}.md"

      - name: Download Protobuf Artifact
        id: download_protobuf
        continue-on-error: true
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "block-node-protobuf-${RELEASE_TAG}" \
            --dir ./protobuf-dl
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Download Block-Stream-Tools Artifact
        id: download_tools
        continue-on-error: true
        run: |
          gh run download "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "block-stream-tools-${RELEASE_TAG}" \
            --dir ./tools-dl
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Create Github Release
        uses: step-security/release-action@a0d8e0f90f554c15366ca2c9046bf4090d24adbe # v1.21.0
        with:
          allowUpdates: true
          # Attach all artifacts in a single call to prevent two races:
          # 1. Multiple calls with allowUpdates:true can create duplicate releases
          #    when GitHub's API hasn't yet propagated the first create by the
          #    time a second call performs its lookup-by-tag.
          # 2. Each subsequent call with omitBodyDuringUpdate:false (the default)
          #    overwrites the release body with an empty string, erasing the notes.
          # artifactErrorsFailBuild:false preserves the old per-step behaviour of
          # skipping gracefully when a preceding download step failed.
          artifactErrorsFailBuild: false
          artifacts: "./protobuf-dl/block-node-protobuf-*.tgz,./tools-dl/block-stream-tools-*.jar"
          bodyFile: "${{ env.RELEASE_NOTES_FILENAME }}.md"
          commit: ${{ env.RELEASE_BRANCH }}
          draft: true
          generateReleaseNotes: false
          name: ${{ env.RELEASE_TAG }}
          prerelease: ${{ needs.release.outputs.is_prerelease == 'true' }}
          tag: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}

  create_pr:
    timeout-minutes: 10
    name: Create PR
    runs-on: hl-bn-lin-md
    needs: release
    if: ${{ !inputs.dry_run && needs.release.outputs.create_pr == 'true' }}
    env:
      NEXT_VERSION_SNAPSHOT: ${{ needs.release.outputs.next_version_snapshot }}
      RELEASE_BRANCH: ${{ needs.release.outputs.release_branch }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Import GPG Key
        id: gpg_importer
        uses: step-security/ghaction-import-gpg@c0b4a334b9b72bfaaebec86ef022a78a5b17f828 # v7.0.0
        with:
          git_commit_gpgsign: true
          git_tag_gpgsign: true
          git_user_signingkey: true
          gpg_private_key: ${{ secrets.GPG_KEY_CONTENTS }}
          passphrase: ${{ secrets.GPG_KEY_PASSPHRASE }}

      - name: Install JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25.0.2"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Reset main to release branch
        run: |
          git fetch origin $RELEASE_BRANCH:$RELEASE_BRANCH
          git reset --hard $RELEASE_BRANCH

      - name: Gradle Release for Next Minor Snapshot
        run: ./gradlew versionAsSpecified -PnewVersion=${{ env.NEXT_VERSION_SNAPSHOT }}

      - name: Create Pull Request
        uses: step-security/create-pull-request@50c103da2b9ca12cd5bc013fc6931051a5aa872b # v8.1.1
        with:
          author: ${{ steps.gpg_importer.outputs.name }} <${{ steps.gpg_importer.outputs.email }}>
          body: Bump versions for v${{ env.NEXT_VERSION_SNAPSHOT }}
          branch: create-pull-request/${{ env.RELEASE_BRANCH }}
          commit-message: Bump versions for v${{ env.NEXT_VERSION_SNAPSHOT }}
          committer: ${{ steps.gpg_importer.outputs.name }} <${{ steps.gpg_importer.outputs.email }}>
          delete-branch: true
          signoff: true
          title: ${{ needs.release.outputs.pr_title }}
          token: ${{ secrets.GH_ACCESS_TOKEN }}
