# SPDX-License-Identifier: Apache-2.0
name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-links:
    name: Internal links
    if: github.event_name != 'schedule'
    runs-on: hl-bn-lin-md
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lychee (if not present)
        run: |
          if ! command -v lychee &>/dev/null; then
            curl -sLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
            tar -xzf lychee-x86_64-unknown-linux-musl.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
            chmod +x lychee
          fi

      - name: Check internal links
        run: ./lychee --config .lychee.toml --offline --no-progress '**/*.md'

  anchor-links:
    name: Anchor links
    if: github.event_name != 'schedule'
    runs-on: hl-bn-lin-md
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.x"

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check@3.12.2

      - name: Check anchor links
        run: |
          status=0
          while IFS= read -r file; do
            markdown-link-check --config .markdown-link-check.json --quiet "$file" || status=1
          done < <(find . -name "*.md" \
            ! -path "./.github/*" \
            ! -path "*/build/*" \
            ! -path "./.gradle/*" \
            ! -path "./protobuf-sources/*")
          exit $status

  external-links:
    name: External links (advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: hl-bn-lin-md
    continue-on-error: true
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lychee (if not present)
        run: |
          if ! command -v lychee &>/dev/null; then
            curl -sLO https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
            tar -xzf lychee-x86_64-unknown-linux-musl.tar.gz --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
            chmod +x lychee
          fi

      - name: Check external links
        run: ./lychee --config .lychee.toml --no-progress '**/*.md'
