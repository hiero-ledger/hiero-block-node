# SPDX-License-Identifier: Apache-2.0
# 2 Consensus Nodes, 2 Block Nodes with minio cloud-storage archiving on BN1
# and bidirectional backfill.
#
# BN1 archives to local minio using cloud-storage-archive (TAR) and cloud-storage-expanded (.blk.zstd).
# BN1 ↔ BN2 (backfill)
# MN ← BN1, BN2
#
# NOTE: grpc_tuning.max_frame_size is set to 8MB to match server.http2.maxFrameSize and handle larger blocks.
# This can be removed once Block Node v0.27+ is released, as the default will be increased.

name: 2cn-2bn-archive
description: "2 CNs, 2 BNs with minio cloud-storage archiving on BN1 and bidirectional backfill"

minio_nodes:
  minio-1:
    buckets: [block-archive-tar, block-archive-expanded]
    port: 9000

block_nodes:
  block-node-1:
    address: block-node-1
    port: 40840
    peers: [block-node-2]
    greedy: false
    archive:
      backend: minio
      node: minio-1
    grpc_tuning:
      max_frame_size: 8388608
  block-node-2:
    address: block-node-2
    port: 40840
    peers: [block-node-1]
    greedy: false
    grpc_tuning:
      max_frame_size: 8388608

consensus_nodes:
  node1:
    block_nodes: [block-node-1]
  node2:
    block_nodes: [block-node-2]

mirror_nodes:
  mirror-1:
    block_nodes: [block-node-1, block-node-2]

relay_nodes:
  # relay-1: {}
