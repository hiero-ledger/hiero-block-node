#
# WRB Distribution E2E (#3125 slice 6) — steps 11+12, builds on slices 1-5.
#
# Same DEPLOY-TIME shape as wrb-distribution-step10 / -step89 / -step67: 3 CNs
# v0.75 + MN1 v0.157.1, no Block Node. BN1/BN2/BN3 are added post-deploy
# (steps 3-5), MN1 is reconfigured and MN2 installed post-deploy (steps 6-7),
# the CN is redirected to BN3 and wrb-cli pushes to BN1 (steps 8-9), BN2/BN3
# are reconfigured to backfill from BN1 (step 10), all via command events in
# the test definition — and slice 6 adds the TSS cutover and its validation
# (steps 11-12) on top:
#
#   1-2.  Solo brings up CN+MN, wrb-cli baseline wrap, live-wrap loop forked.
#   3-5.  Add BN1/BN2/BN3, EMB=0/0/100_000_000, assert per-BN EMB.
#   6-7.  Reconfigure MN1 to pull live blocks from BN2/BN3; install MN2
#         pointing at BN2/BN3 from genesis.
#   8-9.  Reconfigure the 3 CNs to publish to BN3; move blocks from the
#         wrb-cli to BN1 (historical bulk-load + live push).
#   10.   Reconfigure BN2 and BN3 to set BN1 as a backfill source.
#   11.   Upgrade the 3 CNs to a TSS/WRAPS-native version (v0.76) and
#         validate BN1's (then BN2/BN3's) serverStatusDetail reports
#         populated TSS data.
#   12.   Stop CN record-file production (simulate cutover) and validate all
#         BNs and MNs converge on the same last-available block.
#
# See the wrb-distribution-step345.yaml topology comment for why BN
# installation stays post-deploy (Solo skips MinIO tenant install when BNs
# are declared at deploy time).

name: wrb-distribution-steps1-12
description: "WRB distribution E2E (#3125) — steps 1-12: full BN/MN distribution chain + TSS cutover to v0.76 + CN cutover validation"

# No Block Nodes at deploy time. See topology comment above.
block_nodes: {}

consensus_nodes:
  node1: {}
  node2: {}
  node3: {}

mirror_nodes:
  mirror-1: {}

relay_nodes: {}

explorer_nodes: {}
