#
# Smoke Test
#
# Quick validation that the network is functioning correctly.
# Verifies all block nodes are healthy and receiving blocks.
#
# Prerequisites:
#   - Any topology deployed (default: single)
#   - Port forwards active (task port-forward)
#
# Usage:
#   task test:run TEST_FILE=tests/smoke-test.yaml

name: smoke-test
description: "Quick smoke test for network validation"

events:
  - id: initial-status
    type: network-status
    description: "Initial network status"
    delay: 5

  - id: metrics
    type: print-metrics
    description: "Metrics snapshot"
    delay: 30
    args:
      target: all

  - id: final-status
    type: network-status
    description: "Final network status"
    delay: 45

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All Block Nodes are healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All Block Nodes have blocks"
    target: all
    args:
      min_block: 0

  # Topologies where a Block Node has no publisher of its own (fan-out-3cn-2bn) feed that node
  # by peer backfill, which advances on a scan interval rather than continuously. The window has
  # to outlast one interval or the node reads as stalled between scans.
  - id: all-blocks-increasing
    type: blocks-increasing
    description: "All Block Nodes are receiving new blocks"
    target: all
    args:
      wait_seconds: 15
      max_attempts: 6
