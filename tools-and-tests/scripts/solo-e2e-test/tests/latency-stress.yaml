# SPDX-License-Identifier: Apache-2.0
#
# Stress-Level CN↔BN Latency — 1/3 BN Degradation Test
#
# One of three BNs (BN1) receives severe CN↔BN and BN→BN latency; the other
# two BNs run at normal latency. This creates a binary divergence: BN1 falls
# behind BN2/BN3, which can then serve as backfill sources once chaos clears.
#
#   BN1  — "far region"  : CN↔BN1 800 ms ± 200 ms + 75% loss (corr 75%), BN1→BN 1000 ms (direction=to)
#   BN2  — "normal"      : no chaos
#   BN3  — "normal"      : no chaos
#   CNs  — global light  : CN↔CN 100 ms ± 20 ms  (simulates geographic spread)
#
# Packet loss on CN↔BN1 causes bursty correlated drops that break the gRPC
# stream, forcing a reconnect during which BN1 misses blocks → BackfillPlugin
# detects the sequence gap and fetches missing blocks from BN2/BN3.
#
# BN→BN uses direction=to (unidirectional) to avoid double-stacking with any
# future BN-side rules and to keep BN2/BN3 → BN1 backfill traffic unimpeded.
#
# Intent: validates that a single degraded BN does not break the cluster and
# that it successfully backfills gaps from healthy peers once the fault clears.
#
# Requires topology with ≥ 3 BNs that have backfill peers configured
# (e.g. paired-3, 7cn-3bn-distributed). The dryrun check will fail on 3cn-1bn.
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/latency-stress.yaml

name: latency-stress
description: "CN↔BN severe latency on 1/3 of BNs (BN1) — single-node degradation & backfill probe"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 420

  - id: inject-cn-cn
    type: inject-latency
    description: "Inject CN↔CN 100ms ± 20ms — light global CN background latency"
    delay: 30
    args:
      name: cn-to-cn
      source: { kind: network-node }
      target: { kind: network-node }
      latency: 100ms
      jitter: 20ms
      bidirectional: true

  - id: inject-cn-bn1
    type: inject-latency
    description: "Inject CN↔BN1 800ms ± 200ms + 75% loss (corr 75%) — BN1 severe tier"
    delay: 35
    args:
      name: cn-to-bn1
      source: { kind: network-node }
      target: { kind: block-node, name: block-node-1 }
      latency: 800ms
      jitter: 200ms
      correlation: "75"
      bidirectional: true
      loss: "75%"

  - id: inject-bn1-bn
    type: inject-latency
    description: "Inject BN1→BN peers 1000ms ± 250ms (direction=to) — BN1 slow peer replication"
    delay: 40
    args:
      name: bn1-to-bn
      source: { kind: block-node, name: block-node-1 }
      target: { kind: block-node }
      latency: 1000ms
      jitter: 250ms
      correlation: "75"
      bidirectional: false

  - id: clear-cn-cn
    type: clear-latency
    description: "Clear CN↔CN"
    delay: 330
    args: { name: cn-to-cn }

  - id: clear-cn-bn1
    type: clear-latency
    description: "Clear CN↔BN1"
    delay: 332
    args: { name: cn-to-bn1 }

  - id: clear-bn1-bn
    type: clear-latency
    description: "Clear BN1→BN peers"
    delay: 334
    args: { name: bn1-to-bn }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 360

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs remain healthy despite BN1 severe latency"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs have blocks after chaos clears"
    target: all
    args:
      min_block: 0

  - id: backfill-triggered
    type: backfill-triggered
    description: "BN1 fell behind BN2/BN3 under severe latency and caught up via backfill"
    target: block-node-1
    args:
      grep: "backfill"
      since_seconds: 480

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after latency clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
