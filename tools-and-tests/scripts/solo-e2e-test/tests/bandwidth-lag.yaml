# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag — CN→BN1 + BN-Peers→BN1 Throughput Cap
#
# Reproduces the cumulative-lag production failure mode that tc-netem latency
# tests cannot exercise: BN1's ingest rate drops below the block production rate
# so lag grows monotonically until chaos clears.
#
# Design:
#   - CN→BN1 is capped at 6mbit/s, shaped on the CN sender's own egress
#     (direction=to), targeting BN1's k8s Service (target: { kind: service,
#     name: block-node-1 }) rather than its pod IP.
#   - All BN peers→BN1 are also capped at 6mbit/s the same way, so greedy
#     backfill cannot instantly neutralise the ingest cap during chaos.
#   - BN2 and BN3 receive no throttle — they serve as the reference nodes that
#     advance at full speed, making the spread measurable.
#
# See ../scripts/chaos-templates/README.md for why the bandwidth action needs
# `target: { kind: service }` (Service-ClusterIP vs. pod-IP addressing),
# egress-only tc semantics, and the "kbit"/"mbit" vs "kbps"/"mbps" unit
# distinction — all three cost real debugging time and are easy to get wrong
# when tuning this test further.
#
# Rate rationale (6mbit/s -- "healthy real-world link" tier; see -stress
# and -severe for tighter tiers): previously scaled proportionally from a
# real 10k-TPS reference block (projected ~41.6 MB/block) -- a real run at
# 300mbit/s showed zero divergence (all BNs identical at peak chaos) despite
# genuinely reaching ~6,000 TPS and crossing the TSS transition, because this
# harness's own content (pure CryptoTransfer, no HCS) measured only ~868 KB/
# block, not the projected 41.6 MB -- content *mix*, not just TPS, drives
# bytes/block. Re-derived from that observed number instead: floor at the
# observed ~0.467 blk/s = 867,673 x 8 x 0.467 ~= 3.24 Mbit/s. 6mbit/s
# preserves the same ~1.8x margin as every prior derivation. See -stress
# (3500kbit/s, ~1.08x) and -severe (1750kbit/s, ~0.54x).
#
# Assertions:
#   blocks-diverged  min_spread=3, 5 snapshots (90/150/210/270/320) — a single
#                                     fixed-delay snapshot's spread varies a lot
#                                     run to run at the same rate/content profile
#                                     (session data: 1-6). Samples several points
#                                     across the chaos window and asserts on the
#                                     PEAK spread seen, instead of gambling on one.
#   blocks-converged tolerance=10   — BN1 may have a larger gap to close via
#                                     backfill after chaos clears; allow 10 blocks.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag.yaml

name: bandwidth-lag
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (6mbit/s) — cumulative-lag production failure mode (minimal-constraint tier)"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load (concurrency=50, confirmed to reach this harness's real ~6,000 TPS ceiling; max_tps=11000 forces RateLimitedQueue over AdaptiveQueue -- confirmed no effect on the ceiling either way, kept for memory headroom)"
    delay: 0
    args:
      concurrency: 50
      accounts: 10
      duration: 480
      max_tps: 11000

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 6mbit/s (direction=to, target=service/block-node-1) — forces BN1 ingest below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "6mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 6mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "6mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos-1
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 1/5 across the chaos window (see blocks-diverged: peak spread across all 5 wins, not any single one)"
    delay: 90
    args: { snapshot_id: peak-chaos-1 }

  - id: snapshot-peak-chaos-2
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 2/5"
    delay: 150
    args: { snapshot_id: peak-chaos-2 }

  - id: mid-tx-presence
    type: mirror-tx-presence
    description: "Per-type presence over a real 100s window, mid-chaos -- confirms whether Mirror Node Monitor's pinger scenario (CONSENSUSSUBMITMESSAGE) is actually landing transactions, independent of avg-block-size (which is dominated by TSS-phase measurement-window timing, not content mix)"
    delay: 200
    args:
      window_seconds: 100

  - id: snapshot-peak-chaos-3
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 3/5"
    delay: 210
    args: { snapshot_id: peak-chaos-3 }

  - id: snapshot-peak-chaos-4
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 4/5"
    delay: 270
    args: { snapshot_id: peak-chaos-4 }

  - id: snapshot-peak-chaos-5
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 5/5 (≈10s before bandwidth clears)"
    delay: 320
    args: { snapshot_id: peak-chaos-5 }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 420

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 3 blocks apart at peak chaos, at the WORST of 5 samples across the chaos window — confirms bandwidth cap caused cumulative lag on BN1, robust to which exact moment happens to show the most lag (single-snapshot spread varied 1-6 across real runs this session at the same rate/content)"
    args:
      snapshot_ids: [peak-chaos-1, peak-chaos-2, peak-chaos-3, peak-chaos-4, peak-chaos-5]
      min_spread: 3

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 10 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 10

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30

  - id: avg-block-size
    type: avg-block-size-floor
    description: "Real avg bytes/block from files_recent_total_bytes_stored ÷ files_recent_blocks_written over the recovery window (diagnostic: min_bytes is a sanity floor, not a tuned expectation. Block size varies by TSS phase: steady-state blocks run small (~35KB), the one-time Schnorr->WRAPS transition block is a large single-item outlier (tens of MB, uncompressed), and every block after that carries a compressed TSS proof and runs meaningfully bigger than pre-transition steady-state (measured ~870-930KB/block) -- a big jump in the printed value after the transition is expected, not a red flag)"
    target: all
    args:
      min_bytes: 1000
      window_seconds: 30
