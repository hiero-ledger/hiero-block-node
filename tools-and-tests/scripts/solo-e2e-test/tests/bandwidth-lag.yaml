# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag — CN→BN1 + BN-Peers→BN1 Throughput Cap
#
# Reproduces the cumulative-lag production failure mode that tc-netem latency
# tests cannot exercise: BN1's ingest rate drops below the block production rate
# so lag grows monotonically until chaos clears.
#
# Design:
#   - CN→BN1 is capped at 100kbit/s, shaped on the CN sender's own egress
#     (direction=to), targeting BN1's k8s Service (target: { kind: service,
#     name: block-node-1 }) rather than its pod IP.
#   - All BN peers→BN1 are also capped at 100kbit/s the same way, so greedy
#     backfill cannot instantly neutralise the ingest cap during chaos.
#   - BN2 and BN3 receive no throttle — they serve as the reference nodes that
#     advance at full speed, making the spread measurable.
#
# See ../scripts/chaos-templates/README.md for why the bandwidth action needs
# `target: { kind: service }` (Service-ClusterIP vs. pod-IP addressing),
# egress-only tc semantics, and the "kbit" vs "kbps" unit distinction — all
# three cost real debugging time and are easy to get wrong when tuning this
# test further.
#
# Rate rationale (100kbit/s):
#   In the paired-3 topology each CN streams to its paired BN, so BN1 receives
#   blocks only from CN1. 100kbit/s (12.5 KB/s) caps ingest well below the
#   observed block production rate so lag builds reliably and should reach
#   ≥ 5 blocks in the 150s chaos window. If the spread is still insufficient,
#   lower further; if blocks are larger the spread will be much higher — raise
#   min_spread accordingly. Tune based on observed block sizes from test run
#   metrics.
#
# Known issue: at this rate, CN's reconnect to BN1 can permanently deadlock
# after chaos clears (blocks-converged/blocks-increasing/block-rate-floor fail
# indefinitely, not just slowly) — see
# agent/proposals/solo-chaos-spike/findings/005-cn-bn-reconnect-deadlock-after-bandwidth-starvation.md
# (local, not committed) before tightening this further.
#
# Assertions:
#   blocks-diverged  min_spread=5   — conservative; real runs with 100 KB blocks
#                                     at 0.5 blk/s should exceed this comfortably.
#   blocks-converged tolerance=10   — BN1 may have a larger gap to close via
#                                     backfill after chaos clears; allow 10 blocks.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag.yaml

name: bandwidth-lag
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (100kbit/s) — cumulative-lag production failure mode"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 480

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 100kbit/s (direction=to, target=service/block-node-1) — forces BN1 ingest below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "100kbit"
      limit: 1000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 100kbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "100kbit"
      limit: 1000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 420

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative; tune min_spread upward once observed block sizes are known)"
    args:
      snapshot_id: peak-chaos
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 10 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 10

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
