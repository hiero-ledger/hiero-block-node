# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag — CN→BN1 + BN-Peers→BN1 Throughput Cap
#
# Reproduces the cumulative-lag production failure mode that tc-netem latency
# tests cannot exercise: BN1's ingest rate drops below the block production rate
# so lag grows monotonically until chaos clears.
#
# Design:
#   - CN→BN1 is capped at 15mbit/s, shaped on the CN sender's own egress
#     (direction=to), targeting BN1's k8s Service (target: { kind: service,
#     name: block-node-1 }) rather than its pod IP.
#   - All BN peers→BN1 are also capped at 15mbit/s the same way, so greedy
#     backfill cannot instantly neutralise the ingest cap during chaos.
#   - BN2 and BN3 receive no throttle — they serve as the reference nodes that
#     advance at full speed, making the spread measurable.
#
# See ../scripts/chaos-templates/README.md for why the bandwidth action needs
# `target: { kind: service }` (Service-ClusterIP vs. pod-IP addressing),
# egress-only tc semantics, and the "kbit"/"mbit" vs "kbps"/"mbps" unit
# distinction — all three cost real debugging time and are easy to get wrong
# when tuning this test further.
#
# Rate rationale (15mbit/s — this is the "minimal constraint" tier of the
# bandwidth-lag family; see -stress and -severe for tighter tiers):
#   Real block size and CN behavior observed in CI (not the ~100 KB estimate
#   this test originally assumed) put the actual critical zone in single-digit
#   Mbit/s, not kbit/s:
#     - a real block was ~2.1 MB; at 0.5 blk/s that means BN1 needs ≥ ~8.5
#       Mbit/s sustained just to keep up (block_bytes × 8 × blk_rate).
#     - CN's own per-request send timeout (~2.5s observed) means a single
#       ~2.1 MB block must transfer at ≥ ~6.8 Mbit/s or CN times out and
#       resets the connection outright — the trigger for the permanent
#       reconnect deadlock described in
#       agent/proposals/solo-chaos-spike/findings/005-cn-bn-reconnect-deadlock-after-bandwidth-starvation.md
#       (local, not committed).
#   Most CNs run on a shared ~1 Gbps NIC, so realistic degraded-bandwidth
#   scenarios are a small fraction of that link, not the multi-Gbps range.
#   15mbit/s (~1.5% of a 1 Gbps link) sits comfortably above both floors
#   above — a real block still sends in ~1.1s, well inside CN's timeout — so
#   this tier should show a measurable but non-catastrophic, recoverable lag.
#   Earlier revisions of this test used kbit/s-scale rates (50-500kbit/s); at
#   any of those, a single block can never transfer within CN's timeout, so
#   every rate in that range hit the identical reconnect deadlock regardless
#   of the specific number — see finding 005 above for how that was diagnosed.
#
# Assertions:
#   blocks-diverged  min_spread=5   — conservative starting point for this
#                                     rate; retune against observed spread.
#   blocks-converged tolerance=10   — BN1 may have a larger gap to close via
#                                     backfill after chaos clears; allow 10 blocks.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag.yaml

name: bandwidth-lag
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (15mbit/s) — cumulative-lag production failure mode (minimal-constraint tier)"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 480

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 15mbit/s (direction=to, target=service/block-node-1) — forces BN1 ingest below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "15mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 15mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "15mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 420

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative; tune min_spread upward once observed block sizes are known)"
    args:
      snapshot_id: peak-chaos
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 10 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 10

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
