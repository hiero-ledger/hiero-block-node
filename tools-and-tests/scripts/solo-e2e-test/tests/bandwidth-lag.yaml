# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag — CN→BN1 + BN-Peers→BN1 Throughput Cap
#
# Reproduces the cumulative-lag production failure mode that tc-netem latency
# tests cannot exercise: BN1's ingest rate drops below the block production rate
# so lag grows monotonically until chaos clears.
#
# Design:
#   - CN→BN1 is capped at 500mbit/s, shaped on the CN sender's own egress
#     (direction=to), targeting BN1's k8s Service (target: { kind: service,
#     name: block-node-1 }) rather than its pod IP.
#   - All BN peers→BN1 are also capped at 500mbit/s the same way, so greedy
#     backfill cannot instantly neutralise the ingest cap during chaos.
#   - BN2 and BN3 receive no throttle — they serve as the reference nodes that
#     advance at full speed, making the spread measurable.
#
# See ../scripts/chaos-templates/README.md for why the bandwidth action needs
# `target: { kind: service }` (Service-ClusterIP vs. pod-IP addressing),
# egress-only tc semantics, and the "kbit"/"mbit" vs "kbps"/"mbps" unit
# distinction — all three cost real debugging time and are easy to get wrong
# when tuning this test further.
#
# Rate rationale (500mbit/s -- "healthy real-world link" tier of the
# bandwidth-lag family; see -stress and -severe for tighter tiers):
#   Superseding the earlier light-load-derived tiers (10/4/1 mbit/s), which
#   were calibrated against a ~35-40 KB/block measurement that turned out to
#   be ~2000x smaller than real content at production scale. A real block
#   sample (10k-TPS network, well after genesis -- i.e. steady-state
#   post-TSS-transition steady state: compressed proof, not the one-time
#   transition block itself) measures 69,323,814 bytes uncompressed. Since
#   CN does not compress bytes on the wire today (planned for a future
#   release, ~v0.79), that uncompressed figure is the wire-relevant size.
#   At 0.5 blk/s: sustained-need floor = 69,323,814 x 8 x 0.5 ~= 277.3 Mbit/s
#   -- the first time this floor has landed in the same range as real
#   observed CN<->BN link bandwidths (a separate network-measurement effort
#   found 150-510 Mbit/s typical cross-region, 53-156 Mbit/s worst-case real
#   outliers, and >300/<225 Mbit/s as the actual production cutoffs used to
#   decide whether a link is viable for BN routing).
#   500mbit/s sits at the high end of that "typical, healthy" range -- ~1.8x
#   margin above the 277.3 Mbit/s floor -- deliberately representing a
#   well-provisioned link, not an edge case. See bandwidth-lag-stress.yaml
#   (300mbit/s, production's own "viable" cutoff) and bandwidth-lag-severe.yaml
#   (150mbit/s, below production's own "too low" cutoff -- structurally
#   cannot sustain live post-transition-scale ingest) for the tighter tiers.
#   Important caveat: this test's own NLG-generated content is still light-load
#   (concurrency/accounts below), so its actual block size stays far below the
#   real post-transition block sample used to derive this rate -- these rates constrain real
#   mainnet-scale content, not what this specific test run currently produces.
#   Getting real post-transition-sized content flowing through this test (rather than just
#   documenting the target rate) is a separate, in-progress effort.
#
# Assertions:
#   blocks-diverged  min_spread=5   — conservative starting point for this
#                                     rate; retune against observed spread.
#   blocks-converged tolerance=10   — BN1 may have a larger gap to close via
#                                     backfill after chaos clears; allow 10 blocks.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag.yaml

name: bandwidth-lag
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (500mbit/s) — cumulative-lag production failure mode (minimal-constraint tier)"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 480

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 500mbit/s (direction=to, target=service/block-node-1) — forces BN1 ingest below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "500mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 500mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "500mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 420

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative; tune min_spread upward once observed block sizes are known)"
    args:
      snapshot_id: peak-chaos
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 10 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 10

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30

  - id: avg-block-size
    type: avg-block-size-floor
    description: "Real avg bytes/block from files_recent_total_bytes_stored ÷ files_recent_blocks_written over the recovery window (diagnostic: min_bytes is a sanity floor, not a tuned expectation. Block size varies by TSS phase: steady-state blocks run small (~35KB), the one-time Schnorr->WRAPS transition block is a large single-item outlier (tens of MB, uncompressed), and every block after that carries a compressed TSS proof and runs meaningfully bigger than pre-transition steady-state (measured ~870-930KB/block) -- a big jump in the printed value after the transition is expected, not a red flag)"
    target: all
    args:
      min_bytes: 1000
      window_seconds: 30
