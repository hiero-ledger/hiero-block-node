# SPDX-License-Identifier: Apache-2.0
#
# Block Ingestion Test (#2767)
#
# E2E test to validate Mirror Node block ingestion in Solo environment.
# Phase 1: Basic ingestion test (MN1 → BN1)
# Phase 2: Separate namespace test (MN2 → BN2 in isolated namespace)
#
# Test Flow:
#   1. Deploy network with wrb-differential-test topology (1 CN, 1 BN)
#   2. Wait for CN to produce blocks
#   3. Phase 1: Deploy MN1 → BN1, validate ingestion
#   4. Phase 2: Copy blocks to separate namespace, deploy BN2+MN2, validate
#
# Prerequisites:
#   - Deploy with topology: wrb-differential-test
#   - Port forwards active (task port-forward)
#
# Usage:
#   task test:run TEST_FILE=tests/wrb-differential-test.yaml TOPOLOGY=wrb-differential-test

name: wrb-differential-test
description: "Block ingestion test with separate namespace isolation"

events:
  - id: initial-status
    type: network-status
    description: "Confirm nodes are running"
    delay: 5

  - id: block-production-wait
    type: sleep
    description: "Wait for CN to produce blocks"
    delay: 10
    args:
      seconds: 60

  - id: run-ingestion-test
    type: command
    description: "Run block ingestion test (Phase 1 + Phase 2)"
    delay: 75
    timeout: 1200
    args:
      script: "${SCRIPT_DIR}/wrb-sequential-comparison.sh"

  - id: final-status
    type: network-status
    description: "Post-test network status"
    delay: 90

assertions:
  - id: bn1-healthy
    type: node-healthy
    description: "Block Node 1 is healthy"
    target: block-node-1

  - id: bn1-has-blocks
    type: block-available
    description: "BN1 has blocks from CN"
    target: block-node-1
    args:
      min_block: 0

  # This topology deploys no Mirror Node up front — the test script deploys MN1 several
  # minutes in. The BN's roster-bootstrap-rsa plugin can only fetch the RSA address book
  # from the Mirror Node REST API, so the first blocks the CN streams always fail with
  # MISSING_VERIFICATION_DATA until the roster arrives. A strict `no-errors` assertion
  # counts those startup failures and can never pass here. Assert on the RSA proof path
  # instead, which tolerates startup failures and checks the signals that matter: roster
  # loaded, RSA verifications accumulating, no roster mismatches.
  - id: rsa-verification-active
    type: rsa-roster-verification
    description: "BN1 verifies blocks via the RSA roster with no roster mismatches"
    target: block-node-1
    args:
      min_rsa_success: 1
