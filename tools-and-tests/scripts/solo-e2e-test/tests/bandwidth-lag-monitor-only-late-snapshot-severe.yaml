# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Severe — Monitor-only traffic (no NLG)
#
# Severe tier of the Monitor-only bandwidth-lag family: structurally
# insufficient link. See bandwidth-lag-monitor-only-late-snapshot.yaml (base)
# and bandwidth-lag-monitor-only-late-snapshot-stress.yaml (stress) for the
# milder tiers and for the full rate-derivation rationale.
#
# Rate re-derivation (5250kbit/s): same formula and same real content samples
# as the base/stress tiers -- 866,698 / 2,574,119 / 2,782,229 / 3,991,184
# bytes/block (mean ~2.55MB), floor = 2,600,000 x 8 x 0.467 blk/s ~= 9.71
# Mbit/s. 5250kbit/s preserves the same ~0.54x margin as
# bandwidth-lag-severe.yaml's original derivation -- BN structurally cannot
# keep up with this tier's ingest, by design.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 MIRROR_NODE_PINGER_TPS=5000 MIRROR_NODE_XFER_TPS=5000 task test:run TEST_FILE=tests/bandwidth-lag-monitor-only-late-snapshot-severe.yaml

name: bandwidth-lag-monitor-only-late-snapshot-severe
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (5250kbit/s) — Monitor-only traffic, structurally insufficient tier"

events:
  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 5250kbit/s (direction=to, target=service/block-node-1) — structurally insufficient for this content profile"
    delay: 30
    args:
      name: cn-to-bn1-bw-severe
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "5250kbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 5250kbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-severe
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "5250kbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: mid-tx-presence
    type: mirror-tx-presence
    description: "Per-type presence over a real 100s window, mid-chaos -- confirms Monitor's scenario(s) are landing transactions"
    delay: 200
    args:
      window_seconds: 100

  - id: snapshot-peak-chaos-1
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 1/5 across the chaos window (see blocks-diverged: peak spread across all 5 wins, not any single one)"
    delay: 90
    args: { snapshot_id: peak-chaos-severe-1 }

  - id: snapshot-peak-chaos-2
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 2/5"
    delay: 180
    args: { snapshot_id: peak-chaos-severe-2 }

  - id: snapshot-peak-chaos-3
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 3/5"
    delay: 270
    args: { snapshot_id: peak-chaos-severe-3 }

  - id: snapshot-peak-chaos-4
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 4/5"
    delay: 360
    args: { snapshot_id: peak-chaos-severe-4 }

  - id: snapshot-peak-chaos-5
    type: snapshot-block-heights
    description: "Capture per-BN block heights, sample 5/5 (≈10s before bandwidth clears)"
    delay: 440
    args: { snapshot_id: peak-chaos-severe-5 }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 450
    args: { name: cn-to-bn1-bw-severe }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 455
    args: { name: peer-to-bn1-bw-severe }

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 3 blocks apart at peak chaos, at the WORST of 5 samples across the chaos window — robust to which exact moment happens to show the most lag"
    args:
      snapshot_ids: [peak-chaos-severe-1, peak-chaos-severe-2, peak-chaos-severe-3, peak-chaos-severe-4, peak-chaos-severe-5]
      min_spread: 3

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 25 blocks after bandwidth clears — allows extra margin for this tier's thinner timeout safety margin"
    args:
      tolerance_blocks: 25

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears -- max_attempts extended to 30 (30 min budget), see bandwidth-lag-monitor-only-late-snapshot.yaml for why"
    target: all
    args:
      wait_seconds: 90
      max_attempts: 30

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30

  - id: avg-block-size
    type: avg-block-size-floor
    description: "Real avg bytes/block from files_recent_total_bytes_stored ÷ files_recent_blocks_written over the recovery window (diagnostic: min_bytes is a sanity floor, not a tuned expectation. Block size varies by TSS phase: steady-state blocks run small (~35KB), the one-time Schnorr->WRAPS transition block is a large single-item outlier (tens of MB, uncompressed), and every block after that carries a compressed TSS proof and runs meaningfully bigger than pre-transition steady-state -- a big jump in the printed value after the transition is expected, not a red flag)"
    target: all
    args:
      min_bytes: 1000
      window_seconds: 30
