# SPDX-License-Identifier: Apache-2.0
#
# Severe ("breaking-point") CN↔BN Latency — Geo-Asymmetric Gradient Test
#
# Three-tier per-BN latency that forces real divergence between BNs so that
# backfill fires reliably:
#
#   BN1  — "very far"  : CN↔BN1 800 ms ± 200 ms + 25% loss (corr 75%), BN1→BN 1000 ms (direction=to)
#   BN2  — "mid-range" : CN↔BN2 400 ms ± 100 ms + 15% loss (corr 75%), BN2→BN  500 ms (direction=to)
#   BN3  — "local"     : no CN↔BN or BN→BN chaos  (fastest; BN1/2 backfill from it)
#   CNs  — global      : CN↔CN 600 ms ± 150 ms, corr 75%  (bidirectional)
#
# Packet loss on CN↔BN1/2 causes bursty correlated drops that break gRPC
# streams, forcing reconnects during which BN1 (and BN2) miss blocks →
# BackfillPlugin detects sequence gaps and fetches missing blocks from BN3.
#
# BN→BN rules use direction=to (unidirectional) so the two per-BN rules do not
# additively stack on the BN1↔BN2 path.
#
# Intent: BN3 accumulates blocks fastest; BN2 falls behind; BN1 falls furthest
# behind. After chaos clears, BN1 (and possibly BN2) must backfill missing
# blocks from BN3, exercising the BackfillPlugin gap-fill path.
#
# Requires topology with ≥ 3 BNs that have backfill peers configured
# (e.g. paired-3, 7cn-3bn-distributed). The dryrun check will fail on 3cn-1bn.
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/latency-severe.yaml

name: latency-severe
description: "Per-BN CN↔BN latency gradient (severe/mid/none) — asymmetric divergence & backfill recovery probe"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 480

  - id: inject-cn-cn
    type: inject-latency
    description: "Inject CN↔CN 600ms ± 150ms (corr 75%) — global consensus latency"
    delay: 30
    args:
      name: cn-to-cn
      source: { kind: network-node }
      target: { kind: network-node }
      latency: 600ms
      jitter: 150ms
      correlation: "75"
      bidirectional: true

  - id: inject-cn-bn1
    type: inject-latency
    description: "Inject CN↔BN1 800ms ± 200ms + 25% loss (corr 75%) — BN1 very-far tier"
    delay: 35
    args:
      name: cn-to-bn1
      source: { kind: network-node }
      target: { kind: block-node, name: block-node-1 }
      latency: 800ms
      jitter: 200ms
      correlation: "75"
      bidirectional: true
      loss: "25%"

  - id: inject-cn-bn2
    type: inject-latency
    description: "Inject CN↔BN2 400ms ± 100ms + 15% loss (corr 75%) — BN2 mid-range tier"
    delay: 40
    args:
      name: cn-to-bn2
      source: { kind: network-node }
      target: { kind: block-node, name: block-node-2 }
      latency: 400ms
      jitter: 100ms
      correlation: "75"
      bidirectional: true
      loss: "15%"

  - id: inject-bn1-bn
    type: inject-latency
    description: "Inject BN1→BN peers 1000ms ± 250ms (direction=to) — BN1 peer latency"
    delay: 45
    args:
      name: bn1-to-bn
      source: { kind: block-node, name: block-node-1 }
      target: { kind: block-node }
      latency: 1000ms
      jitter: 250ms
      correlation: "75"
      bidirectional: false

  - id: inject-bn2-bn
    type: inject-latency
    description: "Inject BN2→BN peers 500ms ± 125ms (direction=to) — BN2 peer latency"
    delay: 50
    args:
      name: bn2-to-bn
      source: { kind: block-node, name: block-node-2 }
      target: { kind: block-node }
      latency: 500ms
      jitter: 125ms
      correlation: "75"
      bidirectional: false

  - id: clear-cn-cn
    type: clear-latency
    description: "Clear CN↔CN"
    delay: 370
    args: { name: cn-to-cn }

  - id: clear-cn-bn1
    type: clear-latency
    description: "Clear CN↔BN1"
    delay: 372
    args: { name: cn-to-bn1 }

  - id: clear-cn-bn2
    type: clear-latency
    description: "Clear CN↔BN2"
    delay: 374
    args: { name: cn-to-bn2 }

  - id: clear-bn1-bn
    type: clear-latency
    description: "Clear BN1→BN peers"
    delay: 376
    args: { name: bn1-to-bn }

  - id: clear-bn2-bn
    type: clear-latency
    description: "Clear BN2→BN peers"
    delay: 378
    args: { name: bn2-to-bn }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load"
    delay: 420

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive severe asymmetric latency and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: backfill-triggered
    type: backfill-triggered
    description: "BN1 fell furthest behind and caught up via backfill after chaos cleared"
    target: block-node-1
    args:
      grep: "backfill"
      since_seconds: 600

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after latency clears"
    target: all
    args:
      wait_seconds: 60
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30