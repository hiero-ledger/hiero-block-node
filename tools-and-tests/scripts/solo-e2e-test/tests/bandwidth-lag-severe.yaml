# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Severe — CN→BN1 + BN-Peers→BN1 Throughput Cap at 200kbit/s
#
# Severe tier of the bandwidth-lag failure mode family.
# Models a production scenario where ~50% of CN ingest capacity is lost
# (e.g. 13 of 39 CNs reaching BN1 normally, rest degraded — the DR split case).
#
# Rate units — chaos-mesh's bandwidth "rate" field uses "kbit" for kilobits/s
# and "kbps" for kilobytes/s (8x kbit). See bandwidth-lag.yaml for the CI
# evidence (tc qdisc dump) that a "kbps" value here would be applied at 8x
# the intended cap. Use "kbit" explicitly.
#
# Direction: selector=BN1 / direction=from, not selector=sender / direction=to.
# See bandwidth-lag.yaml for the full explanation and CI evidence (0 bytes in
# the throttled tc band all test long) — CN/BN-peers reach BN1 via its k8s
# Service, so a rule on the sender's egress filtered by dst=BN1's pod IP never
# matches; installing it on BN1's own ingress, filtered by source IP, does.
#
# Design:
#   - CN→BN1 is capped at 200kbit/s — BN1 receives blocks at ~50% of the data
#     rate (~50 KB/s = 400kbit/s needed; 200kbit/s allows only ~25 KB/s).
#   - All BN peers→BN1 are also capped at 200kbit/s so greedy backfill cannot
#     neutralise the ingest cap during chaos.
#   - BN2 and BN3 receive no throttle — they serve as reference nodes.
#
# Rate rationale (200kbit/s):
#   Lag accrues at ~50% of the block rate (0.5 blk/s × 50% = 0.25 blk/s).
#   Over the 150s chaos window this produces ~37 blocks of divergence.
#   This corresponds to roughly the DR-split scenario: 13 of 39 CNs reaching
#   BN1, with the remaining 26 CN streams effectively blocked — matching the
#   13-CN-per-BN DR target from the production traffic profile.
#
# Assertions:
#   blocks-diverged  min_spread=15  — conservative; expect 30+ blocks at 200kbit/s
#                                     with 100 KB blocks at 0.5 blk/s.
#   blocks-converged tolerance=25   — BN1 has a larger backfill gap to close
#                                     than in the baseline bandwidth-lag test.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag-severe.yaml

name: bandwidth-lag-severe
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (200kbit/s) — severe cumulative-lag (DR-split analog)"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 480

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap BN1's ingress from CN to 200kbit/s (selector=block-node-1, direction=from) — BN1 ingest drops to ~50% of block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw-severe
      source: { kind: block-node, name: block-node-1 }
      target: { kind: network-node }
      rate: "200kbit"
      limit: 250000
      buffer: 10000
      direction: from

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN1's ingress from BN peers to 200kbit/s (selector=block-node-1, direction=from) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-severe
      source: { kind: block-node, name: block-node-1 }
      target: { kind: block-node }
      rate: "200kbit"
      limit: 250000
      buffer: 10000
      direction: from

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos-severe }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw-severe }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw-severe }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load — extended to allow BN1 backfill of its larger gap"
    delay: 450

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 15 blocks apart at peak chaos — confirms 200kbit/s cap caused severe cumulative lag on BN1"
    args:
      snapshot_id: peak-chaos-severe
      min_spread: 15

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 25 blocks after bandwidth clears — BN1 closes its larger backfill gap"
    args:
      tolerance_blocks: 25

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 90
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
