# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Severe — CN→BN1 + BN-Peers→BN1 Throughput Cap at 2mbit/s
#
# Severe tier of the bandwidth-lag failure mode family: the tightest cap,
# aimed at actually finding the permanent reconnect deadlock in finding 005
# below rather than just sitting near it — i.e. the first tier meaningfully
# probing the breaking point, not assumed to already be at its edge. See
# bandwidth-lag.yaml (minimal constraint) and bandwidth-lag-stress.yaml
# (significant but manageable) for the milder tiers.
#
# See ../scripts/chaos-templates/README.md for why this test uses "mbit" (not
# "mbps") and target: { kind: service } (not a pod selector) — both gotchas
# cost real debugging time and are easy to get wrong when tuning further.
#
# Rate rationale (2mbit/s): see bandwidth-lag.yaml for the full derivation.
# This tier's old value (7mbit/s) was derived from an assumed ~2.1 MB block
# and framed as "right at the edge of CN's per-block send timeout." The
# avg-block-size-floor assertion below now reads the real value directly off
# BN metrics: two clean CI samples (runs 33265848789, 33269987877) both
# landed at ~35-40 KB/block — ~55-60x smaller than assumed. Recomputed, the
# real per-request-timeout floor is ~0.11 Mbit/s and the sustained-need floor
# is ~0.14 Mbit/s (see bandwidth-lag.yaml), not 6.8-8.5 Mbit/s. That means
# 7mbit/s was never actually close to making a real block miss CN's timeout —
# consistent with every severe-tier run on record (6+ runs) fully recovering;
# this tier never found its claimed edge. 2mbit/s is a first exploratory step
# into the real, still largely-unexplored transition zone (~0.5-7 Mbit/s: the
# old kbit/s-scale rates below ~0.5 Mbit/s always deadlocked, 7mbit/s always
# recovered) — deliberately the tightest of the three retiered tiers, and the
# most likely to actually surface the permanent-deadlock behavior finding 005
# describes. If it does, that IS the point: find where "significant lag, but
# recovers" turns into "never recovers," rather than assume this number is
# already safely inside "always recovers."
#
# Known issue this rate is chosen to probe the edge of:
# agent/proposals/solo-chaos-spike/findings/005-cn-bn-reconnect-deadlock-after-bandwidth-starvation.md
# (local, not committed) — if this tier reproduces the permanent-stall
# behavior (blocks-converged/blocks-increasing/block-rate-floor failing
# indefinitely, not just slowly), that's the breaking point; loosen slightly
# and re-run to bracket it rather than assuming a fluke.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag-severe.yaml

name: bandwidth-lag-severe
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (2mbit/s) — edge-of-breaking-point tier"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      test_class: CryptoTransferLoadTest
      concurrency: 10
      accounts: 20
      duration: 480

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 2mbit/s (direction=to, target=service/block-node-1) — probing the real transition zone toward CN's per-block send timeout"
    delay: 30
    args:
      name: cn-to-bn1-bw-severe
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "2mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 2mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-severe
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "2mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos-severe }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw-severe }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw-severe }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load — extended to allow BN1 backfill of its larger gap"
    delay: 450
    args:
      test_class: CryptoTransferLoadTest

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive bandwidth throttle and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative starting point for this rate; retune against observed spread)"
    args:
      snapshot_id: peak-chaos-severe
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 25 blocks after bandwidth clears — allows extra margin for this tier's thinner timeout safety margin"
    args:
      tolerance_blocks: 25

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 90
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30

  - id: avg-block-size
    type: avg-block-size-floor
    description: "Real avg bytes/block from files_recent_total_bytes_stored ÷ files_recent_blocks_written over the recovery window (diagnostic: min_bytes is a sanity floor, not a tuned expectation — read the printed value to see whether this load's blocks are actually big enough to stress the bandwidth cap)"
    target: all
    args:
      min_bytes: 1000
      window_seconds: 30
