# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Stress — CN→BN1 + BN-Peers→BN1 Throughput Cap at 9mbit/s
#
# Stress tier of the bandwidth-lag failure mode family: "significant but
# manageable" — a heavier constraint than the base bandwidth-lag tier, but
# still meant to recover, not permanently deadlock. See bandwidth-lag-severe
# for the tier meant to sit at the edge of breaking.
#
# See ../scripts/chaos-templates/README.md for why this test uses "mbit" (not
# "mbps") and target: { kind: service } (not a pod selector) — both gotchas
# cost real debugging time and are easy to get wrong when tuning further.
#
# Rate rationale (9mbit/s): see bandwidth-lag.yaml for the full derivation.
# In short, a real block was ~2.1 MB and CN's own per-request send timeout is
# ~2.5s, putting the critical zone at roughly 6.8-8.5 Mbit/s (the rate below
# which a single block can't transfer within CN's timeout at all, triggering
# the permanent reconnect deadlock in finding 005 below) — not the kbit/s
# range this test originally used (every kbit/s-scale rate hits that same
# deadlock regardless of the specific number). 9mbit/s (~0.9% of a typical
# ~1 Gbps shared CN NIC) sits just above that floor: a block takes ~1.89s to
# send, inside CN's ~2.5s timeout but with less margin than the 15mbit/s base
# tier, so lag should accrue faster and recovery should take longer without
# guaranteeing the outright deadlock.
#
# Known issue this rate is chosen to stay above:
# agent/proposals/solo-chaos-spike/findings/005-cn-bn-reconnect-deadlock-after-bandwidth-starvation.md
# (local, not committed) — a cap tight enough that a single block can't
# transfer within CN's send timeout can permanently deadlock the connection,
# so blocks-converged/blocks-increasing/block-rate-floor fail indefinitely
# rather than just needing more time. Not yet confirmed this rate avoids it —
# retune based on the next CI run's actual result.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag-stress.yaml

name: bandwidth-lag-stress
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (9mbit/s) — significant-but-manageable stress tier"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 540

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 9mbit/s (direction=to, target=service/block-node-1) — degrades BN1's ingest significantly below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw-stress
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "9mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 9mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-stress
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "9mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos-stress }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw-stress }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw-stress }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load — extended window to allow BN1 to begin closing its large gap"
    delay: 510

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive severe bandwidth starvation and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative starting point for this rate; retune against observed spread)"
    args:
      snapshot_id: peak-chaos-stress
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 15 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 15

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 120
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
