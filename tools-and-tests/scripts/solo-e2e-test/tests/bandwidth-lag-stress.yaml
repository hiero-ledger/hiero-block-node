# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Stress — CN→BN1 + BN-Peers→BN1 Throughput Cap at 500kbit/s
#
# Stress tier of the bandwidth-lag failure mode family.
# Models a severe (but not total) CN→BN ingest degradation — e.g. a saturated
# fabric uplink or a cloud AZ routing event.
#
# See ../scripts/chaos-templates/README.md for why this test uses "kbit" (not
# "kbps") and target: { kind: service } (not a pod selector) — both gotchas
# cost real debugging time and are easy to get wrong when tuning further.
#
# Rate: temporarily loosened from 50kbit/s to 500kbit/s. The original 50kbit/s
# figure assumed ~100 KB blocks; CI showed real blocks running closer to 2 MB,
# and bandwidth-lag's 100kbit/s tier (an even looser cap than 50kbit/s) was
# enough to permanently deadlock the CN↔BN1 reconnect (see finding 005 below)
# rather than just accumulate lag. 500kbit/s is a provisional value to get a
# runnable, non-guaranteed-failure test while that's investigated — it has
# not yet been validated against a real block-size/timeout recalculation.
# Re-tune both the rate and the assertions below once finding 005 is
# understood well enough to pick a rate deliberately instead of by guess.
#
# Known issue this rate is chosen to avoid (not yet confirmed it does):
# agent/proposals/solo-chaos-spike/findings/005-cn-bn-reconnect-deadlock-after-bandwidth-starvation.md
# (local, not committed) — a cap tight enough relative to actual block size
# vs. CN's per-request send timeout can permanently deadlock the connection,
# so blocks-converged/blocks-increasing/block-rate-floor fail indefinitely
# rather than just needing more time.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag-stress.yaml

name: bandwidth-lag-stress
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (500kbit/s) — stress scenario (rate provisional, see file header)"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 5
      accounts: 10
      duration: 540

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 500kbit/s (direction=to, target=service/block-node-1, rate provisional — see file header) — degrades BN1's ingest well below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw-stress
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "500kbit"
      limit: 625000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 500kbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-stress
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "500kbit"
      limit: 625000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos-stress }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw-stress }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw-stress }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load — extended window to allow BN1 to begin closing its large gap"
    delay: 510

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive severe bandwidth starvation and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative and provisional — retune against observed spread once this tier has run to conclusion)"
    args:
      snapshot_id: peak-chaos-stress
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 15 blocks after bandwidth clears — allows BN1 time to close its backfill gap (provisional, see file header)"
    args:
      tolerance_blocks: 15

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 120
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30
