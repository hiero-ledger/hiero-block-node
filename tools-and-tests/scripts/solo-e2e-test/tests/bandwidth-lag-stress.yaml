# SPDX-License-Identifier: Apache-2.0
#
# Bandwidth-Lag Stress — CN→BN1 + BN-Peers→BN1 Throughput Cap at 3.5mbit/s
#
# Stress tier of the bandwidth-lag failure mode family: a heavier constraint
# than the base bandwidth-lag tier, but still meant to mostly recover, with
# real measurable strain. See bandwidth-lag-severe for the tighter tier.
#
# See ../scripts/chaos-templates/README.md for why this test uses "mbit" (not
# "mbps") and target: { kind: service } (not a pod selector) — both gotchas
# cost real debugging time and are easy to get wrong when tuning further.
#
# Rate rationale (3.5mbit/s): see bandwidth-lag.yaml for the full derivation
# -- re-derived from this harness's actually-observed block size (~868 KB/
# block, confirmed real via a run at the previous 300mbit/s rate that showed
# zero divergence despite reaching ~6,000 TPS) rather than a projection
# scaled from the real 10k-TPS reference network's content, which turned out
# to overestimate this harness's own bytes/block by ~48x (content mix, not
# just TPS, drives real block size). Floor ~3.24 Mbit/s; 3.5mbit/s preserves
# the same ~1.08x margin as every prior derivation.
#
# Requires topology: paired-3 (≥ 3 BNs; CN1 streams exclusively to BN1).
#
# Pre-req:
#   task up TOPOLOGY=paired-3
#   CHAOS_ENABLED=true task chaos:install
#
# Usage:
#   CHAOS_ENABLED=true TOPOLOGY=paired-3 task test:run TEST_FILE=tests/bandwidth-lag-stress.yaml

name: bandwidth-lag-stress
description: "CN→BN1 + BN-peers→BN1 bandwidth cap (3.5mbit/s) — significant-but-manageable stress tier"

events:
  - id: load-start
    type: load-start
    description: "Start NLG load"
    delay: 0
    args:
      concurrency: 50
      accounts: 10
      duration: 540

  - id: inject-cn-bn1-bw
    type: inject-bandwidth
    description: "Cap CN's egress to BN1's Service at 3.5mbit/s (direction=to, target=service/block-node-1) — degrades BN1's ingest significantly below block production rate"
    delay: 30
    args:
      name: cn-to-bn1-bw-stress
      source: { kind: network-node }
      target: { kind: service, name: block-node-1 }
      rate: "3.5mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: inject-peer-bn1-bw
    type: inject-bandwidth
    description: "Cap BN-peers' egress to BN1's Service at 3.5mbit/s (direction=to, target=service/block-node-1) — prevents greedy backfill from neutralising the ingest cap"
    delay: 35
    args:
      name: peer-to-bn1-bw-stress
      source: { kind: block-node }
      target: { kind: service, name: block-node-1 }
      rate: "3.5mbit"
      limit: 3000000
      buffer: 10000
      direction: to

  - id: snapshot-peak-chaos
    type: snapshot-block-heights
    description: "Capture per-BN block heights at peak chaos (≈150s into chaos window)"
    delay: 180
    args: { snapshot_id: peak-chaos-stress }

  - id: clear-cn-bn1-bw
    type: clear-bandwidth
    description: "Clear CN→BN1 bandwidth cap"
    delay: 330
    args: { name: cn-to-bn1-bw-stress }

  - id: clear-peer-bn1-bw
    type: clear-bandwidth
    description: "Clear BN peers→BN1 bandwidth cap"
    delay: 335
    args: { name: peer-to-bn1-bw-stress }

  - id: load-stop
    type: load-stop
    description: "Stop NLG load — extended window to allow BN1 to begin closing its large gap"
    delay: 510

assertions:
  - id: all-healthy
    type: node-healthy
    description: "All BNs survive severe bandwidth starvation and stay/return healthy"
    target: all

  - id: all-have-blocks
    type: block-available
    description: "All BNs still have blocks after chaos"
    target: all
    args:
      min_block: 0

  - id: blocks-diverged
    type: blocks-diverged
    description: "BNs were at least 5 blocks apart at peak chaos — confirms bandwidth cap caused cumulative lag on BN1 (conservative starting point for this rate; retune against observed spread)"
    args:
      snapshot_id: peak-chaos-stress
      min_spread: 5

  - id: blocks-converged
    type: blocks-converged
    description: "All BNs converge to within 15 blocks after bandwidth clears — allows BN1 time to close its backfill gap"
    args:
      tolerance_blocks: 15

  - id: blocks-increasing
    type: blocks-increasing
    description: "Block production recovers on all BNs after bandwidth clears"
    target: all
    args:
      wait_seconds: 120
      max_attempts: 5

  - id: block-rate-floor
    type: block-rate-floor
    description: "Post-chaos block rate recovers to ≥ 0.1 blk/s on all BNs"
    target: all
    args:
      min_rate_per_sec: 0.1
      window_seconds: 30

  - id: avg-block-size
    type: avg-block-size-floor
    description: "Real avg bytes/block from files_recent_total_bytes_stored ÷ files_recent_blocks_written over the recovery window (diagnostic: min_bytes is a sanity floor, not a tuned expectation. Block size varies by TSS phase: steady-state blocks run small (~35KB), the one-time Schnorr->WRAPS transition block is a large single-item outlier (tens of MB, uncompressed), and every block after that carries a compressed TSS proof and runs meaningfully bigger than pre-transition steady-state (measured ~870-930KB/block) -- a big jump in the printed value after the transition is expected, not a red flag)"
    target: all
    args:
      min_bytes: 1000
      window_seconds: 30
