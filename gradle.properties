# SPDX-License-Identifier: Apache-2.0
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle Caching
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# Disable publish signing by default
publishSigningEnabled=false

# Test blocks: one OCI package, tags <flavor>-<YYYY.MM.DD>-<N>[-p<k>], pinned by digest.
# ./gradlew fetchTestBlocks downloads them into .test-blocks/<flavor>/. See docs/test-blocks.md.
hiero.testBlocks.package=ghcr.io/hiero-ledger/hiero-block-node/test-blocks
# BN runners mount published flavors read-only at <mountDir>/<flavor>/p<k>/; a flavor is linked from
# there instead of pulled when every part's VERSION matches its pin.
hiero.testBlocks.mountDir=/opt/block-node/test-blocks
hiero.testBlocks.image.ci=ci-2026.11.03-1@sha256:4d4c7236661852d189c985f1f8732dbbe8f1a76a45dd5c1d3f8e54cf2b207e3a
