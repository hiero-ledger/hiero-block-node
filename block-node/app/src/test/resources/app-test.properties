# since the poll interval outlasts every test
cloud.storage.download.endpointUrl=http://localhost:9
cloud.storage.download.regionName=us-east-1
cloud.storage.download.bucketName=unused
cloud.storage.download.accessKey=unused
cloud.storage.download.secretKey=unused
cloud.storage.download.pollIntervalMs=3600000
