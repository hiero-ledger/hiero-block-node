{{- /*
  One ConfigMap per dashboard JSON under dashboards/, discovered by glob: together they exceed the
  1 MiB ConfigMap limit, and a hand list silently drifts (a missing path renders as "").
*/}}
{{- if .Values.kubepromstack.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/**.json" }}
{{- $dashboard := base $path }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hiero-block-node.fullname" $ }}-dashboard-{{ trimSuffix ".json" $dashboard }}
  labels:
    grafana_dashboard: "1"
data:
  {{ $dashboard }}: {{ $.Files.Get $path | quote }}
{{- end }}
{{- end }}
