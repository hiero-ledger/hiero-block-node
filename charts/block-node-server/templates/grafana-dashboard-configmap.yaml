{{ if .Values.kubepromstack.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: block-node-dashboard-configmap
  labels:
    grafana_dashboard: "1"
data:
  {{- /*
    Every dashboard JSON under dashboards/ is published, discovered by glob rather than listed
    by hand: an explicit list is a third copy that silently drifts from the rendered files
    (a missing path makes .Files.Get return "" instead of failing, so the sidecar would load an
    empty dashboard). Covers both the shared dashboards rendered from
    tools-and-tests/dashboards/src and the chart's own hand-maintained extras.
  */}}
  {{- range $path, $_ := .Files.Glob "dashboards/**.json" }}
  {{ base $path }}: {{ $.Files.Get $path | quote }}
  {{- end }}

{{- end }}
