# This override values for the block-node-server chart to deploy a mini version of the block-node-server.
# This is useful for testing and development purposes with limited resources.
# ie: minikube

# 192Mi fits the TSS library (native code, verification key and verification threads, ~129 MB peak at
# 1 CPU) with headroom; at 128M the node is OOM-killed while verifying TSS block proofs.
# MemoryRegressionTests runs the node with these limits.
resources:
  requests:
    cpu: "500m"
    memory: "192Mi"
  limits:
    cpu: "1"
    memory: "192Mi"

blockNode:
  config:
    JAVA_OPTS: '-Xmx24m -XX:MaxDirectMemorySize=8m -XX:MaxMetaspaceSize=32m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath="/tmp/dump.hprof"'
    SERVER_SOCKET_RECEIVE_BUFFER_SIZE_BYTES: "131072"
    SERVER_SOCKET_SEND_BUFFER_SIZE_BYTES: "131072"
    MESSAGING_BLOCK_ITEM_QUEUE_SIZE: "128"
    MESSAGING_BLOCK_NOTIFICATION_QUEUE_SIZE: "16"
    # The TSS library verifies block proofs on several native threads; without a cap each grows its own
    # glibc malloc arena, which adds 60 to 130 MB of native memory. Two arenas keep the node within the
    # nano envelope (MemoryRegressionTests guards this).
    MALLOC_ARENA_MAX: "2"
    BACKFILL_FETCH_BATCH_SIZE: "5"
  persistence:
    archive:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      existingClaim: "nano-archive-storage"
    live:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-live-pvc"
    logging:
      size: 1Gi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-logging-pvc"
    applicationState:
      size: 100Mi
      # Optionally specify an existing PVC name instead of creating via volumeClaimTemplate
      # existingClaim: "nano-application-state-pvc"
  health:
    readiness:
      initialDelaySeconds: 30
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 35
      periodSeconds: 10
      timeoutSeconds: 3
      successThreshold: 1
      failureThreshold: 3

kubepromstack:
  enabled: false

loki:
  enabled: false

promtail:
  enabled: false
