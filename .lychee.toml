# Lychee link checker configuration
# https://lychee.cli.rs/usage/config/

# Patterns excluded from all link checks (matched against the target URL/path)
exclude = [
  "^#",             # Anchor-only links — heading targets can't be verified without HTML rendering
  "^mailto:",       # Email addresses
  "localhost",      # Local development URLs
  "127\\.0\\.0\\.1",
  "broken-reference", # GitBook placeholder for unresolved cross-references
  "\\.java$",       # Links to source-code files — existence verified by build/CI, not link-checker
  "\\.proto$",
  "\\.kts$",
  "\\.gradle$",
  "\\.sh$",
]

# Directories to skip entirely
exclude_path = [
  "build",           # Gradle build artifacts
  ".gradle",         # Gradle cache
  "protobuf-sources", # Git submodule — README links are relative to the source repo, not this one
  ".github",         # PR/issue templates contain placeholder links
]

# HTTP status codes accepted as valid (handles rate-limiting gracefully)
accept = ["200", "206", "429", "999"]

# Retry settings for external link checks
max_retries = 3
retry_wait_time = 5
